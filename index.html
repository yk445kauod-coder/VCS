
<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VCS: المدرسة السحابية الافتراضية</title>
    <meta name="description" content="VCS (Virtual Cloud School) - منصة تعليمية ذكية تعمل بالذكاء الاصطناعي." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playpen+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS (for initial load) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // This config is a fallback and is overridden by the project's tailwind.config.js
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Playpen Sans"', 'cursive', 'sans-serif'],
            },
          },
        },
      }
    </script>
    
    <!-- Preconnect to CDNs -->
    <link rel="preconnect" href="https://aistudiocdn.com" crossorigin>
    
    <style>
      body { 
        font-family: 'Playpen Sans', cursive; 
        background-color: #f8fafc;
        background-image: radial-gradient(#e0e7ff 0.5px, transparent 0.5px);
        background-size: 24px 24px;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

      .glass-panel {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      
      /* Enforce font weights for Arabic */
      [dir="rtl"] {
        font-weight: 600;
      }
      h1, h2, h3, h4, h5, h6 {
        font-weight: 800 !important;
      }
    </style>
  </head>
  <body class="text-slate-800 antialiased selection:bg-indigo-100 selection:text-indigo-700 font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
